name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # The library and CLI are developed on macOS and released as a Zig
    # package consumers build for their own target, so both host platforms
    # the project is actually used on are tested rather than Linux alone.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test
        run: zig build test
      - name: Build CLI
        run: zig build
