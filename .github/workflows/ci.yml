name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # The quick start is OS-neutral and the code has no platform-specific
    # paths, so test the two hosts contributors actually build on.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Test
        run: zig build test
      - name: Build CLI
        run: zig build
