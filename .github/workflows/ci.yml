name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Both jobs only check out and build;
# nothing writes back to the repo. Without this the token inherits the
# repository default, which can be read/write, and every third-party
# action in the run gets that scope.
permissions:
  contents: read

jobs:
  # Static analysis, blocking and separate from the build matrix: formatting,
  # shell lint and Python lint are platform-independent, so one Linux runner
  # covers them.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      # Formatting is the only static check the Zig sources get, so its scope
      # is the whole tree rather than three named paths: a .zig added outside
      # src/ - a tools/ directory, a second build file - is unformatted and
      # silent under the old list. Driving it from the index also keeps
      # .zig-cache out without depending on how `zig fmt` walks a directory.
      - name: Check Zig formatting
        run: git ls-files -z '*.zig' '*.zon' | xargs -0 zig fmt --check
      # Every tracked .sh, not `scripts/*.sh`: that glob covers the top of one
      # directory only, so a script added in a subdirectory, at the repo root
      # or under docs/ would merge unlinted with nothing saying so. Listing
      # them from the index makes the check follow the tree instead of a fixed
      # path. No `xargs -r`: an empty list means the glob stopped matching, and
      # shellcheck failing on no arguments says that out loud rather than
      # reporting a vacuous pass.
      - name: Lint shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      # The generator scripts build data that ships inside the binary, so they
      # are linted like the Zig and the shell is. The version is pinned so a
      # new ruff release adding rules cannot turn a green tree red on an
      # unrelated PR, and so a local run matches what CI enforces.
      - name: Lint Python scripts
        run: pipx run ruff==0.16.8 check scripts

  # The README names four targets beyond the two runners below as "known to
  # build". A platform that is only asserted is not supported: compile each of
  # them so the claim breaks here rather than in a user's checkout. Build-only
  # on purpose - none of these can run their tests on this host, and the README
  # says so. One job rather than a matrix so the four share a checkout and a
  # Zig cache; `zig build` cross-compiles the vendored C++ too.
  cross-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Cross-compile the targets the README claims
        run: |
          for target in x86_64-linux-musl aarch64-linux-gnu x86-linux-gnu x86_64-macos; do
            echo "::group::$target"
            zig build -Dtarget="$target" --prefix "$RUNNER_TEMP/cross/$target"
            echo "::endgroup::"
          done

  build-test:
    # The library and CLI are developed on macOS and released as a Zig
    # package consumers build for their own target, so both host platforms
    # the project is actually used on are tested rather than Linux alone.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Test
        run: zig build test
      - name: Build CLI
        run: zig build
