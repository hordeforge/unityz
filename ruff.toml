# Static analysis for the generator scripts in scripts/. They build data that
# ships inside the binary (src/builtin_trees/*.bin) and the --trees files
# `extract`, `verify` and `show` decode typeless assets with, so a defect here
# is a defect in released output. CI runs `ruff check` and blocks on it, next
# to `zig fmt --check` and `shellcheck`.
#
# The annotations are evaluated at runtime (`str | None`, `dict[str, list[dict]]`,
# no `from __future__ import annotations`), so 3.10 is the real floor.
target-version = "py310"

# The same version CI runs (`pipx run ruff==0.16.6`, .github/workflows/ci.yml).
# The pin in the workflow only binds the runner: a local `ruff check scripts`
# would otherwise enforce whatever version happens to be installed, which is a
# different rule set from the blocking one. Stated here, a mismatched ruff says
# so instead of reporting a green or red tree CI will not reproduce.
required-version = "0.16.6"

[lint]
# Every rule group the tree already passes, on rather than off: the default set
# is pyflakes plus a slice of pycodestyle, which leaves bugbear, the
# performance and modernization groups, and the suppression-hygiene checks
# unenforced. Deliberate omissions are listed under `ignore` and below.
select = [
    "A",    # a builtin shadowed by a local name
    "ANN",  # missing annotations, and `Any` used as one
    "ARG",  # unused function arguments
    "B",    # bugbear: mutable defaults, loop-variable capture, silent bugs
    "BLE",  # blind `except Exception`
    "C4",   # comprehension rewrites
    "C90",  # mccabe complexity
    "DTZ",  # naive datetimes
    "E",    # pycodestyle errors
    "ERA",  # commented-out code
    "EXE",  # shebang and executable bit disagreeing
    "F",    # pyflakes: undefined names, unused imports, shadowed bindings
    "FA",   # annotations needing `from __future__ import annotations`
    "FBT",  # boolean positional arguments
    "FLY",  # static `str.join` that should be an f-string
    "FURB", # refurb modernizations
    "G",    # logging call format
    "I",    # import sorting
    "ICN",  # import naming conventions
    "INP",  # implicit namespace packages
    "ISC",  # implicit string concatenation (a missing comma in a list)
    "LOG",  # logging misuse
    "N",    # pep8 naming
    "PERF", # performance anti-patterns
    "PGH",  # blanket `# noqa` / `# type: ignore` with no rule scope
    "PIE",  # misc lints
    "PLC",  # pylint conventions
    "PLE",  # pylint errors: bad string format, misplaced `raise`, bad `strip`
    "PLR",  # pylint refactor: complexity caps, collapsible `else: if`, `exit()`
    "PLW",  # pylint warnings: unchecked `subprocess.run`, rebound loop var
    "PTH",  # os.path calls that pathlib does better
    "Q",    # quote style
    "RET",  # return-path simplifications
    "RSE",  # `raise X()` vs `raise X`
    "RUF",  # ruff's own rules
    "S",    # bandit: exec, pickle, weak hashes, unchecked subprocess
    "SIM",  # simplifications: collapsible `if`, `contextlib.suppress`, dict.get
    "SLF",  # private member access across objects
    "T10",  # a leftover `breakpoint()` or `pdb` import
    "TC",   # imports only needed for typing
    "TID",  # banned and relative imports
    "TRY",  # exception handling: wrong type for a type check, `except` swallowing
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "YTT",  # `sys.version` misuse
]

# E501 (line length) is off, and this is the one gap left open on purpose.
# Ten lines exceed the ecosystem's 88: two are the copy-pasteable AssetRipper
# TypeTreeDumps curl commands in the module docstrings and one is the dump's
# node regex, none of which should be wrapped, but the rest is ordinary code
# that a cap would legitimately catch. Turning E501 on therefore means
# reformatting those lines first, which is a change to the scripts and not to
# this file. No cap is imposed here in the meantime.
#
# The four rules below each gate a group that is otherwise clean, so the rule
# is dropped rather than the group: with the group selected, every other rule
# in it blocks today and the listed finding is the only thing left to fix
# before the rule itself can come back.
#   PLR2004 - two magic-value comparisons (0xFFFF, 2). The rest of PLR - the
#             complexity caps, `else: if` collapsing, `exit()` outside a REPL -
#             is enforced.
#   PTH123  - five `open()` calls that predate pathlib here. The rest of PTH
#             is enforced.
#   SIM115  - two files opened without a context manager. The rest of SIM,
#             including the boolean and comparison simplifications, is enforced.
#   TRY003  - one long message built at the `raise`. TRY004 (wrong exception
#             type for a type check), TRY300 and TRY400 are enforced.
ignore = ["E501", "PLR2004", "PTH123", "SIM115", "TRY003"]

# Not selected, and not oversights:
#   T20  - these are CLI scripts; `print` is their output channel, not debris.
#   D    - the modules carry docstrings; per-function ones are not required.
#   CPY  - the licence lives in LICENSE and NOTICE, not in a per-file header.
# COM and EM are the only groups still held back wholesale by live findings:
# four missing trailing commas, and a raw string passed straight to `raise`.
# Enabling a group the tree fails would make this file advisory instead of
# blocking; fix the findings, then add the group.
#
# The four pylint subgroups are named individually rather than as the `PL`
# prefix. They cover the same rules between them, but spelling them out keeps
# the reason each one is here visible, and makes it obvious if one is ever
# dropped.

# S101 (assert) is dropped for the one file that has one, not repo-wide: the
# tree's single assert narrows a type (`assert _spec.loader is not None`
# before `exec_module`) and is not a runtime check on input. Scoped here, a
# new assert anywhere else - including in the other two scripts - still
# fails. Everything else bandit looks for stays blocking everywhere: exec,
# pickle, a weak hash, an unchecked subprocess, a parsed URL opened blind.
# That matters for scripts that read a third-party dump and emit a blob the
# binary ships.
[lint.per-file-ignores]
"scripts/structsdump-to-builtin.py" = ["S101"]
